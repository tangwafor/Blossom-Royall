[build]
  command = "npm run build:sites"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_APP_URL = "https://app.blossomroyall.com"
  NEXT_PUBLIC_SUPABASE_URL = "https://ggncqdgpadglvvfxbcng.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_o9aUfNHVxcIV792FFM3rWw_P2D-fWV5"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "https://app.blossomroyall.com/"
  to = "/workspace"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "/readiness"
  status = 302
  force = true

[[redirects]]
  from = "/concept"
  to = "/404.html"
  status = 404
  force = true
